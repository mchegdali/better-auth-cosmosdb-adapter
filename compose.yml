# Local Cosmos DB for the integration tests: `docker compose up -d --wait`, then `pnpm test`.
services:
  cosmosdb:
    # The Linux "vNext" emulator: starts in seconds and serves plain HTTP, so no certificate setup.
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    container_name: cosmosdb-emulator
    ports:
      - "8081:8081" # Cosmos DB API
      - "1234:1234" # Data Explorer (http://localhost:1234)
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
