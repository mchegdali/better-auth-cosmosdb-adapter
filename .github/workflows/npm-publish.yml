# Releases with Changesets. The file keeps its historical name because npm trusted publishing
# (OIDC) is bound to this workflow file.
name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Version or publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # version commits and tags
      pull-requests: write # the "Version Packages" pull request
      id-token: write # npm trusted publishing and provenance
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # pnpm 10 delegates the upload to the npm CLI; OIDC trusted publishing needs npm >= 11.5.1.
      - run: npm install --global npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
